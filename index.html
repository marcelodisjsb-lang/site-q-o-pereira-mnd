
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <section id="primeira" class="mostrar">
            <h1>clique aq</h1>
            <button onclick="avancar()">Clique aqui</button>
        </section>

        <section id="segunda" class="escondida">
            <h1>fds</h1>
        </section>
    </main>

    <script>
        function avancar() {
            const primeira = document.getElementById("primeira");
            const segunda = document.getElementById("segunda");

            primeira.classList.add("saindo");

            setTimeout(() => {
                primeira.classList.add("escondida");
                primeira.classList.remove("saindo");

                segunda.classList.remove("escondida");
                segunda.classList.add("mostrar");
            }, 500);
        }
    </script>

</body>
</html>
